[package]
name = "nexio"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A verified, single-core io_uring runtime for Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/isaim0011/nexio"

[features]
default = []
# COOP_TASKRUN / DEFER_TASKRUN / SINGLE_ISSUER are ON by default (kernel 6.1+;
# the reactor falls back to a plain ring on older kernels). Enable this feature
# to turn them off, e.g. to A/B them in benchmarks.
no-coop-taskrun = []

[dependencies]
io-uring = "0.6"
slab     = "0.4"
libc     = "0.2"
pin-project-lite = "0.2"

[dev-dependencies]
tokio     = { version = "1", features = ["full"] }
criterion = { version = "0.5", features = ["async_tokio"] }
socket2   = { version = "0.5", features = ["all"] }
num_cpus  = "1"
compio    = { version = "0.19.2", features = ["runtime", "io-uring", "io", "net", "fs"] }
monoio    = "0.2.4"
core_affinity = "0.8.3"

# Kani harnesses are compiled separately; this keeps them out of the
# normal test binary.  Run:  cargo kani --harness <name>
# [dev-dependencies.kani]
# version = "0.47"

[[bench]]
name = "echo"
harness = false

[[bench]]
name = "file_io"
harness = false

[[bench]]
name = "udp"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "batched"
harness = false

[[bench]]
name = "zc"
harness = false

[[bench]]
name = "fanout"
harness = false

[[bench]]
name = "xdp"
harness = false

[[bench]]
name = "mshot"
harness = false
