[package]
name = "nexio"
version = "0.2.0"
edition = "2021"
authors = ["isaim0011"]
rust-version = "1.75"
description = "A thread-per-core async runtime with owned-buffer I/O: io_uring on Linux (cancellation layer checked by Miri and Kani), a portable epoll/kqueue/IOCP backend elsewhere"
readme = "README.md"
keywords = ["io-uring", "async", "runtime", "linux", "network"]
categories = ["asynchronous", "network-programming", "os::linux-apis"]
exclude = ["reports/", "research_notes/", "bench/", "benches/", "scripts/", "utcp/", "fuzz/", ".github/", "ROADMAP.md"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/isaim0011/nexio"

[features]
default = []
# COOP_TASKRUN / DEFER_TASKRUN / SINGLE_ISSUER are ON by default (kernel 6.1+;
# the reactor falls back to a plain ring on older kernels). Enable this feature
# to turn them off, e.g. to A/B them in benchmarks.
no-coop-taskrun = []
# Use the portable readiness backend (epoll/kqueue/IOCP) even on Linux, e.g. where io_uring is blocked.
poll = ["dep:polling"]
# Implement tokio::io::AsyncRead/AsyncWrite for nexio streams (nexio::compat::Compat).
tokio-compat = ["dep:tokio"]
# HTTP/1.1 client and server built on hyper (implies the hyper I/O traits for Compat).
http = ["dep:hyper", "dep:http-body-util"]
# TLS via rustls (nexio::tls), crypto provider ring.
tls = ["dep:rustls"]

[dependencies]
slab     = "0.4"
libc     = "0.2"
pin-project-lite = "0.2"
# Portable backend; pulled in automatically off Linux, or on Linux with `--features poll`.
polling  = { version = "3", optional = true }
tokio    = { version = "1", default-features = false, optional = true }
hyper    = { version = "1", default-features = false, features = ["http1", "client", "server"], optional = true }
http-body-util = { version = "0.1", optional = true }
rustls   = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
socket2  = { version = "0.5", features = ["all"] }

[target.'cfg(unix)'.dependencies]
signal-hook-registry = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
polling  = "3"

[dev-dependencies]
tokio     = { version = "1", features = ["full"] }
criterion = { version = "0.5", features = ["async_tokio"] }
socket2   = { version = "0.5", features = ["all"] }
num_cpus  = "1"
rcgen     = "0.13"

[target.'cfg(target_os = "linux")'.dev-dependencies]
compio    = { version = "0.19.2", features = ["runtime", "io-uring", "io", "net", "fs"] }
monoio    = "0.2.4"
core_affinity = "0.8.3"

# Kani harnesses are compiled separately; this keeps them out of the
# normal test binary.  Run:  cargo kani --harness <name>
# [dev-dependencies.kani]
# version = "0.47"

[[bench]]
name = "echo"
harness = false

[[bench]]
name = "file_io"
harness = false

[[bench]]
name = "udp"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "batched"
harness = false

[[bench]]
name = "zc"
harness = false

[[bench]]
name = "fanout"
harness = false

[[bench]]
name = "xdp"
harness = false

[[bench]]
name = "mshot"
harness = false
