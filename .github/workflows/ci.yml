name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test, fmt, docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run tests (lib, integration, doc)
        run: cargo test

      - name: Check formatting
        run: cargo fmt --check

      - name: Build examples and benchmark programs (compile only)
        run: cargo build --examples --benches

      - name: Rustdoc with warnings as errors
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  clippy:
    name: Clippy All Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy checks
        run: cargo clippy --all-targets -- -D warnings

  miri:
    name: Miri Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Run Miri pure-Rust verification suite
        run: bash scripts/ci_miri.sh

  kani:
    name: Kani Model Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kani proof harnesses
        uses: model-checking/kani-github-action@v1
        with:
          args: "--tests"

  benchmark-smoke:
    name: Release Benchmark Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release benchmark smoke check
        run: cargo bench --bench echo -- --quick

  fuzz:
    name: Fuzz smoke (completion slab state machine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz for 60 seconds
        # The prebuilt cargo-fuzz binary is a musl build and would default to the musl
        # target, where sanitizers cannot work; pin the GNU target explicitly.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu slab_ops -- -max_total_time=60

  portable:
    name: Portable backend (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (IOCP)
            os: windows-latest
            args: ""
          - name: macOS (kqueue)
            os: macos-latest
            args: ""
          - name: Linux (epoll)
            os: ubuntu-latest
            args: "--features poll"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run tests
        run: cargo test ${{ matrix.args }}

      - name: Build examples
        run: cargo build --examples ${{ matrix.args }}

      - name: Clippy (library, tests, examples)
        run: cargo clippy --lib --tests --examples ${{ matrix.args }} -- -D warnings
